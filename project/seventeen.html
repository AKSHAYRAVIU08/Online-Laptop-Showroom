<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <title>Document</title>

    <style>
        body{
            background:#f8f9fa;
            padding:40px;
        }

        .table-container{
            background:#fff;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        .table th{
            background:#007bff;
            color:white;
            text-align:center;
        }

        .table td{
            text-align:center;
            vertical-align:middle;
        }
    </style>
</head>
<body>
{% load static %} 
<div class="container">
    <div class="table-container">
        <h2>ACER Laptop Order Successfull</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-hover table-striped">
                <thead>
                    <tr>
                        <th>LAPTOP</th>
                        <th>PROCCESSOR</th>
                        <th>STORAGE</th>
                        <th>PRICE</th>
                        <th>DOWNLOAD</th>
                        <th>ACTION</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td><img src="{% static 'aspire.jpg' %}" alt="hp laptop images" width="200px" height="200px"></td>
                        <td><b>INTEL CORE i5</b></td>
                        <td><b>16GB RAM</b></td>
                        <td><b>28,999 - 1,59,990</b></td>
                        <td><a href="/eighteen" class="btn btn-danger"><b>VIEW RECIEPT</b></a></td>
                        <td><a href="/payment" class="btn btn-info"><b>PAYMENT</b></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
