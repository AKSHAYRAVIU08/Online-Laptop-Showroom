<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <h1 style="color: saddlebrown; text-align: center;"><b>PRICE OF LAPTOP AVAILABLE IN THE SHOWROOM</b></h1>
    {% load static %}
    <div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <img src="{% static 'hipe.jpg' %}" class="img-fluid" alt="Image 1">
            <p style="text-align: center;"><b style="color: indigo;">55,000 - 1,05,000</b></p>
        </div>

        <div class="col-md-3">
            <img src="{% static 'len.jpg' %}" class="img-fluid" alt="Image 2">
            <p style="text-align: center;"><b style="color: indigo;">50,000 - 80,000</b></p>
        </div>

        <div class="col-md-3">
            <img src="{% static 'aspire.jpg' %}" class="img-fluid" alt="Image 3" width="230px">
            <p style="text-align: center;"><b style="color: indigo;">28,999 - 1,59,990</b></p>
        </div>

        <div class="col-md-3">
            <img src="{% static 'dain.jpg' %}" class="img-fluid" alt="Image 4">
            <p style="text-align: center;"><b style="color: indigo;">80,000 and above</b></p>
        </div>

        <div class="col-md-3">
            <img src="{% static 'samsung.jpg' %}" class="img-fluid" alt="Image 2">
            <p style="text-align: center;"><b style="color: indigo;">1,00,000 and above</b></p>
        </div>
    </div>
</div>
</body>
</html>
